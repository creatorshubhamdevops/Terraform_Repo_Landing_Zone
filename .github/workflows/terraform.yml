name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: root_modules/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "2abb0848-e93e-42a6-b708-5d07b705617e" \
            --password "WnL8Q~_vA5VrufMrIMswWh2N52NZ3sT_Z6ulLa1F" \
            --tenant "4e7e60b9-d7ff-44db-af8d-a2e290bb8a3f"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "9386605f-d403-4aa4-8915-35a1b23d8ef0"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: root_modules/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "2abb0848-e93e-42a6-b708-5d07b705617e" \
            --password "WnL8Q~_vA5VrufMrIMswWh2N52NZ3sT_Z6ulLa1F" \
            --tenant "4e7e60b9-d7ff-44db-af8d-a2e290bb8a3f"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "9386605f-d403-4aa4-8915-35a1b23d8ef0"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan